<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.3" fill="#8c959f"/>
      <circle cx="12" cy="12" r="1.4" fill="#8c959f"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".16" stop-color="white" stop-opacity=".35"/>
      <stop offset=".5" stop-color="white" stop-opacity=".72"/>
      <stop offset=".84" stop-color="white" stop-opacity=".35"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="soft-fade">
      <rect width="1200" height="48" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="48" fill="url(#dots)" mask="url(#soft-fade)" opacity=".48"/>
</svg>
